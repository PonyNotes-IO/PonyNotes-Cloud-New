name: ponynotes

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *service
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ponynotes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d ponynotes]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    <<: *service
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ponynote
      MYSQL_USER: ponynotes
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -Nse "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  redis:
    <<: *service
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    <<: *service
    image: ponynotes/minio:2025-09-07
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/ready]
      interval: 5s
      timeout: 5s
      retries: 20

  gotrue:
    <<: *service
    image: ponynotes/gotrue:73d0a1e-test-otp
    env_file: ./config/gotrue.env
    environment:
      GOTRUE_ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      GOTRUE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_EXP: "7200"
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ponynotes?search_path=auth
      PORT: "9999"
      API_EXTERNAL_URL: http://47.94.42.183/gotrue
      GOTRUE_SITE_URL: appflowy-flutter://
      GOTRUE_URI_ALLOW_LIST: "appflowy-flutter://**,http://47.94.42.183/**"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9999/health]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
  appflowy_cloud:
    <<: *service
    image: ponynotes/cloud:20261028
    env_file: ./config/cloud.env
    depends_on:
      gotrue:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  appflowy_worker:
    <<: *service
    image: ponynotes/cloud:20261028
    command: [appflowy_worker]
    env_file: ./config/cloud.env
    depends_on:
      appflowy_cloud:
        condition: service_healthy

  web_backend:
    <<: *service
    image: eclipse-temurin:17-jre-jammy
    working_dir: /app
    command: [java, -Xms128m, -Xmx768m, -Dfile.encoding=UTF-8, -jar, /app/app.jar, --spring.profiles.active=server]
    environment:
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/ponynote?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: ponynotes
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_PASSWORD:?}
      SPRING_DATASOURCE_DRUID_SLAVE_URL: jdbc:postgresql://postgres:5432/ponynotes
      SPRING_DATASOURCE_DRUID_SLAVE_USERNAME: postgres
      SPRING_DATASOURCE_DRUID_SLAVE_PASSWORD: ${POSTGRES_PASSWORD:?}
      SPRING_DATASOURCE_DRUID_STATVIEWSERVLET_ENABLED: "false"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_DATABASE: "1"
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      PONYNOTES_CLOUD_URL: http://appflowy_cloud:8000
      RUOYI_PROFILE: /app/uploads
      TOKEN_SECRET: ${WEB_TOKEN_SECRET:?}
      FRONTEND_DOMAIN: http://47.94.42.183
      SERVER_TOMCAT_THREADS_MAX: "100"
      SERVER_TOMCAT_THREADS_MINSPARE: "10"
    volumes:
      - ./ruoyi-admin.jar:/app/app.jar:ro
      - web_data:/app/data
      - web_uploads:/app/uploads
      - web_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  nginx:
    <<: *service
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      appflowy_cloud:
        condition: service_healthy
      web_backend:
        condition: service_healthy

volumes:
  postgres_data:
  mysql_data:
  redis_data:
  minio_data:
  web_data:
  web_uploads:
  web_logs:
