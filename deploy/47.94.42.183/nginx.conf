events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=10s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    server_name 47.94.42.183;
    client_max_body_size 200m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = / { default_type application/json; return 200 '{"service":"PonyNotes","cloud":"/api/server","web":"/prod-api/api/health","auth":"/gotrue/health"}'; }
    location /gotrue/ {
      set $auth_backend gotrue:9999;
      rewrite ^/gotrue/(.*)$ /$1 break;
      proxy_pass http://$auth_backend;
    }
    location /prod-api/ {
      set $web_backend web_backend:8080;
      rewrite ^/prod-api/(.*)$ /$1 break;
      proxy_pass http://$web_backend;
    }
    location /minio-api/ {
      proxy_set_header Host minio:9000;
      set $storage_backend minio:9000;
      rewrite ^/minio-api/(.*)$ /$1 break;
      proxy_pass http://$storage_backend;
      proxy_request_buffering off;
    }
    location /ws/ {
      access_log off;
      set $cloud_backend appflowy_cloud:8000;
      proxy_pass http://$cloud_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400s;
    }
    location ~ ^/api/user/verify/ {
      access_log off;
      set $cloud_backend appflowy_cloud:8000;
      proxy_pass http://$cloud_backend;
    }
    location / {
      set $cloud_backend appflowy_cloud:8000;
      proxy_pass http://$cloud_backend;
      proxy_read_timeout 120s;
    }
  }
}
