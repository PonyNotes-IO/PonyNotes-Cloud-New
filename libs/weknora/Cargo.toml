[package]
name = "ponynotes-weknora"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json"] }
sqlx = { workspace = true, default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"] }
tokio = { workspace = true, features = ["time", "fs", "macros", "rt-multi-thread"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
sha2 = "0.10.8"
jsonwebtoken = "8.3.0"
